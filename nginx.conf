user  nginx;
worker_processes  auto;

error_log  /dev/stderr  notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
}

stream {
    log_format  proxy  '$remote_addr -> $upstream_addr '
                       '[$time_local] $protocol $status '
                       'sent:$bytes_sent recv:$bytes_received '
                       'dur:$session_time';
    access_log  /dev/stdout  proxy;

    # Docker's embedded resolver. Requires that wg0.conf carries no `DNS =`
    # line; the entrypoint strips it if present.
    resolver  127.0.0.11  valid=10s  ipv6=off;

    include /etc/nginx/stream.d/*.conf;
}

# Present but empty unless you mount files in. Lets the same image serve an
# HTTP reverse proxy if you ever want one, without a second container.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout  65;

    include /etc/nginx/http.d/*.conf;
}
